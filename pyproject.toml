[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-agent"
version = "0.1.0"
description = "Feishu-based Xiaohongshu account reporting agent"
requires-python = ">=3.9"
dependencies = [
  "httpx==0.27.2",
  "pydantic==2.9.2",
  "python-dateutil==2.9.0.post0",
  "tomli==2.0.2",
  "APScheduler==3.10.4",
  "markdown==3.7",
]

[project.scripts]
xhs-agent = "xhs_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
